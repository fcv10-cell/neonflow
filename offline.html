<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NeonFlow · sin conexión</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #f4f4f0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { min-height: 100%; display: grid; place-items: center; padding: 32px; box-sizing: border-box; text-align: center; }
      .sun { width: 88px; height: 88px; border-radius: 50%; background: #ffd000; margin: 0 auto 28px; }
      h1 { font-weight: 300; font-size: 40px; letter-spacing: 0.04em; margin: 0; }
      p { color: #a3a39d; font-size: 15px; line-height: 1.5; max-width: 340px; margin: 14px auto 0; }
      button { margin-top: 28px; border: 0; border-radius: 999px; background: #ffd000; color: #000; font-weight: 700; font-size: 15px; padding: 14px 28px; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="sun"></div>
        <h1>sin conexión</h1>
        <p>NeonFlow necesita internet la primera vez para descargarse. Conéctate y vuelve a intentarlo; después funcionará también sin conexión.</p>
        <button onclick="location.href='https://fcv10-cell.github.io/neonflow/'">Reintentar</button>
      </div>
    </main>
  </body>
</html>
